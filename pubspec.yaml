name: securecalc
description: "A secure and private calculator application."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.13.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sensors_plus: ^6.1.2
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.35.0
  flutter_ble_peripheral: ^3.1.0
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  open_filex: ^4.7.0
  path_provider: ^2.1.2
  http: ^1.2.0
  socket_io_client: ^3.1.6
  crypto: ^3.0.3
  encrypt: ^5.0.3
  share_plus: ^13.3.0
  fluttertoast: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
